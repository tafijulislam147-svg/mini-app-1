<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desi Hunt Premium Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #050c08; color: #ffffff; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #102a1b; margin-bottom: 15px; }
        .logo { color: #00ff66; font-size: 18px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .search-box { width: 100%; padding: 12px 20px; background: #0b1810; border: 1px solid #163e28; border-radius: 30px; color: #fff; font-size: 15px; margin-bottom: 20px; outline: none; }
        .search-box:focus { border-color: #00ff66; }
        .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .video-card { background: #0b1810; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #163e28; position: relative; }
        .video-card img { width: 100%; height: 130px; object-fit: cover; display: block; background: #102a1b; }
        .video-info { padding: 10px; }
        .video-info p { font-size: 13px; font-weight: bold; line-height: 1.4; color: #e2e8f0; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050c08; justify-content: center; align-items: center; z-index: 9999; padding: 15px; }
        .popup-content { background: #0b1810; padding: 25px 20px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #00ff66; text-align: center; max-height: 90vh; overflow-y: auto; }
        .popup img { width: 100%; border-radius: 8px; margin-bottom: 15px; }
        .ad-instruction { font-size: 14px; color: #ffcc00; margin: 15px 0; font-weight: 600; }
        .progress-bar { width: 100%; background: #102a1b; height: 8px; border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
        .progress-fill { background: #00ff66; height: 100%; width: 0%; transition: 0.3s; }
        .btn { background: #00cc52; color: #000; border: none; padding: 14px; margin: 8px 0; width: 100%; border-radius: 30px; font-size: 15px; font-weight: bold; cursor: pointer; display: block; text-decoration: none; text-align: center; }
        .btn.disabled { background: #102a1b; color: #557a62; cursor: not-allowed; pointer-events: none; }
        
        /* Telegram Native Video Player Setup */
        video { width: 100%; height: 240px; border-radius: 8px; margin-top: 15px; display: none; background: #000; }
        .close-btn { background: #163e28; color: #fff; margin-top: 15px; border-radius: 30px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">☰ Desi Hunt Native</div>
    </div>

    <input type="text" id="searchBar" class="search-box" placeholder="Search from channel video library..." onkeyup="filterVideos()">

    <div class="video-grid" id="videoContainer">Loading Video Files from Channel...</div>

    <!-- ৩টি অ্যাড লকার ও ভিডিও প্লেয়ার পপআপ -->
    <div class="popup" id="videoPopup">
        <div class="popup-content">
            <h3 id="popupTitle" style="font-size:16px; margin-bottom:10px; text-align:left;">Video Preview</h3>
            <img id="popupImg" src="" alt="Preview">
            
            <div class="ad-instruction" id="taskStatus">Watch 3 ads to unlock <br> <span style="font-size:12px; color:#aaa;">Progress: 0/3</span></div>
            <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
            
            <!-- ৩টি সাজানো বিজ্ঞাপনের লিংক -->
            <a href="https://uplcm.com/4/12201287" target="_blank" class="btn" id="adBtn1" onclick="completeAd(1)">Ad 1: Click to Watch</a>
            <a href="https://uplcm.com/4/12201289" target="_blank" class="btn disabled" id="adBtn2" onclick="completeAd(2)">Ad 2: Click to Watch</a>
            <a href="https://uplcm.com/4/12201289" target="_blank" class="btn disabled" id="adBtn3" onclick="completeAd(3)">Ad 3: Final Unlock Ad</a>

            <!-- টেলিগ্রামের ইন্টারনাল ভিডিও প্লেয়ার -->
            <video id="nativeVideoPlayer" controls controlsList="nodownload"></video>
            
            <button class="btn close-btn" onclick="closePopup()">Go Back</button>
        </div>
    </div>

    <script>
        // ⚙️ আপনার প্রদত্ত সঠিক সেটিংস ⚙️
        const BOT_TOKEN = "; 
        const CHANNEL_ID = -; // সঠিক চ্যানেল ফরম্যাট সেট করা হয়েছে
        
        let currentFileId = "";
        let adCount = 0;
        let allVideosData = [];

        window.onload = function() {
            fetchTelegramChannelVideos();
        };

        async function fetchTelegramChannelVideos() {
            try {
                let response = await fetch(`https://telegram.org{BOT_TOKEN}/getUpdates`);
                let result = await response.json();
                let rawMessages = result.result || [];
                parseChannelVideos(rawMessages);
            } catch (error) {
                document.getElementById('videoContainer').innerHTML = "Failed to sync with Telegram Video Server.";
            }
        }

        function parseChannelVideos(messages) {
            allVideosData = [];
            
            messages.forEach(msg => {
                let post = msg.channel_post || (msg.message && msg.message.chat.type === 'channel' ? msg.message : null);
                if(post && post.chat && Number(post.chat.id) === CHANNEL_ID) {
                    let caption = post.caption || "";
                    
                    if(post.video && caption.includes("Title:") && caption.includes("Image:")) {
                        let title = caption.split("Title:")[1].split("Image:")[0].trim();
                        let image = caption.split("Image:")[1].trim();
                        let fileId = post.video.file_id; 
                        
                        allVideosData.push({ title, image, fileId });
                    }
                }
            });

            if(allVideosData.length === 0) {
                document.getElementById('videoContainer').innerHTML = "<p style='grid-column:1/-1; color:#8c8c8c;'>No video files found in the channel. Please upload video with correct caption format (Title: ... Image: ...).</p>";
                return;
            }

            displayVideos(allVideosData.reverse());
        }

        function displayVideos(videos) {
            let container = document.getElementById('videoContainer');
            container.innerHTML = "";
            videos.forEach(item => {
                let card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => openVideo(item.title, item.image, item.fileId);
                card.innerHTML = `
                    <img src="${item.image}" onerror="this.src='https://placehold.co'">
                    <div class="video-info"><p>${item.title}</p></div>
                `;
                container.appendChild(card);
            });
        }

        function filterVideos() {
            let query = document.getElementById('searchBar').value.toLowerCase();
            let filtered = allVideosData.filter(item => item.title.toLowerCase().includes(query));
            displayVideos(filtered);
        }

        async function openVideo(title, image, fileId) {
            currentFileId = fileId;
            adCount = 0;
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupImg').src = image;
            document.getElementById('popupImg').style.display = "block";
            document.getElementById('taskStatus').innerHTML = `Watch 3 ads to unlock <br><span style="font-size:12px; color:#aaa;">Progress: 0/3</span>`;
            document.getElementById('pFill').style.width = "0%";
            
            document.getElementById('adBtn1').classList.remove('disabled');
            document.getElementById('adBtn2').classList.add('disabled');
            document.getElementById('adBtn3').classList.add('disabled');
            
            let player = document.getElementById('nativeVideoPlayer');
            player.style.display = "none";
            player.src = "";
            
            document.getElementById('videoPopup').style.display = "flex";
        }

        async function completeAd(step) {
            if (step === 1 && adCount === 0) {
                adCount = 1;
                document.getElementById('pFill').style.width = "33%";
                document.getElementById('taskStatus').innerHTML = `Watch 3 ads to unlock <br><span style="font-size:12px; color:#aaa;">Progress: 1/3</span>`;
                document.getElementById('adBtn1').classList.add('disabled');
                document.getElementById('adBtn2').classList.remove('disabled');
            } else if (step === 2 && adCount === 1) {
                adCount = 2;
                document.getElementById('pFill').style.width = "66%";
                document.getElementById('taskStatus').innerHTML = `Watch 3 ads to unlock <br><span style="font-size:12px; color:#aaa;">Progress: 2/3</span>`;
                document.getElementById('adBtn2').classList.add('disabled');
                document.getElementById('adBtn3').classList.remove('disabled');
            } else if (step === 3 && adCount === 2) {
                adCount = 3;
                document.getElementById('pFill').style.width = "100%";
                document.getElementById('taskStatus').innerHTML = `<span style="color:#00ff66;">Video Unlocked Successfully!</span>`;
